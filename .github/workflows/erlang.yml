name: Erlang CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        otp: ['29.0', '28.5', '27.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'

      - name: Restore dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: ${{ runner.os }}-otp${{ matrix.otp }}-rebar3-${{ hashFiles('**/rebar.config*') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-rebar3-

      - name: Compile
        run: make compile

      - name: Run checks and tests
        run: make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
